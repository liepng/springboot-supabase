# Supabase Database Configuration

spring.application.name=daka-pro

# DataSource - Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.rrmghbykyvflxqwvgqhu.supabase.co:5432/postgres?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=Lp7997532,./
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== HikariCP 连接池优化 ==========
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=DakaProHikariPool
spring.datasource.hikari.leak-detection-threshold=60000

# ========== MyBatis-Plus Configuration ==========
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.daka.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 生产环境关闭SQL日志（调试时改为 stdout.StdOutImpl）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ========== Jackson JSON ==========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ========== Server ==========
server.port=${PORT:8080}
